    <script>
const root=document.getElementById('valme-v2'),page=root.querySelector('#v-page'),live=root.querySelector('.v-live');
const sections=['Centro de mando','Clientes','Agentes','Supervisión','Operaciones','Informes','Configuración'];
root.querySelector('nav').innerHTML=sections.map((s,i)=>`<button type="button" class="cursor-interaction" data-go="${s}"><span class="v-mono" aria-hidden="true">${String(i+1).padStart(2,'0')}</span>${s}${s==='Supervisión'?'<span class="v-nav-count v-count">18</span>':''}</button>`).join('');
root.querySelector('#v-mobile-select').innerHTML=sections.map(s=>`<option>${s}</option>`).join('');
const specialties=['Onboarding y accesos','Auditoría SEO','Estrategia y planificación','SEO técnico','Contenidos','AEO/GEO y citabilidad','Analítica e informes','Control de calidad'];
const names=['Nébula Hogar','Linde Industrial','Arco Viajes','Cobalto Formación','Bruma Textil','Olmo Energía','Norte Jardín','Prisma Software','Vértice Mobiliario','Senda Equipamiento','Duna Óptica','Cauce Logística','Áurea Cerámica','Pórtico Hábitat','Alba Instrumentos','Surco Editorial','Marea Náutica','Nexo Alimentación'];
const clients=Array.from({length:84},(_,i)=>({id:i+1,name:names[i]||`Empresa Demo ${String(i+1).padStart(3,'0')}`,state:i<6?'Bloqueado':i<18?'En revisión':i<22?'Onboarding':'Piloto automático',service:['SEO + AEO/GEO','SEO técnico + contenidos','SEO + AEO/GEO'][i%3],progress:i<6?42:i<18?78:i<22?25:86,pod:`POD-${String(i+1).padStart(3,'0')}`}));
const specialTitles=['Acceso a Search Console revocado','Error al validar datos estructurados','Rastreo detenido por respuesta 403','Fuente analítica no disponible','Informe detenido: datos insuficientes','Acceso al CMS pendiente','Aprobar 24 redirecciones','Validar actualización de 6 contenidos','Aprobar plan de citabilidad','Revisar arquitectura de categorías','Autorizar entrega del informe','Validar estrategia del próximo ciclo','Aprobar propuestas de enlazado','Validar contenido sobre comparativas','Caída de clics del 18%','Aumento de páginas excluidas','Citas con atribución inconsistente','Desviación de plazo del ciclo'];
const queue=Array.from({length:18},(_,i)=>({id:i+1,client:clients[i],type:i<6?'Bloqueo':i<14?'Aprobación':'Riesgo',title:specialTitles[i],agent:i===1?'SEO técnico':i===4?'Analítica e informes':i===6?'SEO técnico':specialties[i%8],status:i===1?'Error':i===4?'Datos insuficientes':i<6?'Bloqueo':i<14?'Aprobación pendiente':'Riesgo',due:i<2?'SLA vencido · 2 h':i<6?'Hoy · 12:00':'Hoy · 17:00',confidence:i===4?'No evaluable':i<6?'Alta · evaluación demo 0,94':i<14?'Alta · evaluación demo 0,92':'Media · evaluación demo 0,71',evidence:`EV-${String(i+1).padStart(4,'0')}`,result:i<6?'Ciclo detenido; no se ha ejecutado ningún cambio.':i<14?'Propuesta preparada; ejecución pendiente.':'Anomalía registrada para revisión.',timestamp:`18 sep 2026 · 09:${String(10+i+1).padStart(2,'0')} CEST`,reviewable:true,approvalRequired:i>=6&&i<14,resolved:false,decision:''}));
let current='Centro de mando',clientFilter='Todos',qfilter='Todos',clientPage=0,query='',currentItem=null,currentReport=null;
const tag=(text,tone='')=>`<span class="v-tag ${tone}">${text}</span>`;
const tone=s=>/bloque|error|vencido/i.test(s)?'bad':/riesgo|pendiente|revisión|devuelta|insuficientes/i.test(s)?'warn':/automático|completada|aprobada|aprobado|validado|autorizado/i.test(s)?'good':'dark';
const meter=(v,label)=>`<div class="v-meter" role="meter" aria-label="${label}" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><span style="width:${v}%"></span></div>`;
const heading=(eyebrow,title,sub,right='')=>`<div class="v-heading"><div><div class="v-mono v-muted">${eyebrow}</div><h1 tabindex="-1">${title}</h1><p class="v-muted">${sub}</p></div>${right}</div>`;

function focusHeading(){const h=page.querySelector('h1');if(h)requestAnimationFrame(()=>h.focus({preventScroll:true}));}
function announce(message){live.textContent=message;}
function render(s,moveFocus=true){current=s;root.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===s?'page':'false'));root.querySelector('#v-mobile-select').value=s;page.innerHTML=({'Centro de mando':dashboard,'Clientes':clientList,'Agentes':agents,'Supervisión':supervision,'Operaciones':operations,'Informes':reportList,'Configuración':settings}[s])();decorate();window.scrollTo({top:0,behavior:'smooth'});if(moveFocus)focusHeading();}
root.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b)return;
  if(b.dataset.go){
    render(b.dataset.go);
    announce('Vista: '+b.dataset.go+'.');
  }else if(b.dataset.qfilter){
    qfilter=b.dataset.qfilter;
    render('Supervisión');
    announce('Filtro aplicado: '+qfilter+'.');
  }else if(b.dataset.review){
    page.innerHTML=review(queue[Number(b.dataset.review)-1]);
    decorate();focusHeading();announce('Expediente abierto para revisión.');
  }else if(b.dataset.client){
    page.innerHTML=clientDetail(clients[Number(b.dataset.client)-1]);
    decorate();focusHeading();announce('Ficha del cliente abierta.');
  }else if(b.dataset.agent!==undefined){
    page.innerHTML=agentDetail(Number(b.dataset.agent));
    decorate();focusHeading();announce('Detalle del agente abierto.');
  }else if(b.dataset.activity!==undefined){
    page.innerHTML=activityDetail(Number(b.dataset.activity));
    decorate();focusHeading();announce('Evidencia abierta.');
  }else if(b.dataset.report!==undefined){
    page.innerHTML=reportDetail(Number(b.dataset.report));
    decorate();focusHeading();announce('Informe abierto para revisión.');
  }else if(b.dataset.reportAction){
    const r=reports[currentReport];
    if(b.dataset.reportAction==='approve-content'){
      r.contentApproved=true;
      r.status='Contenido aprobado';
      announce('Contenido aprobado en la demostración. El informe no se ha enviado.');
    }else{
      r.deliveryAuthorized=true;
      r.status='Envío autorizado';
      announce('Autorización de envío registrada en la demostración. No se ha enviado ninguna comunicación.');
    }
    page.innerHTML=reportDetail(currentReport);decorate();focusHeading();
  }else if(b.dataset.paging){
    clientPage+=Number(b.dataset.paging);
    root.querySelector('#v-client-list').innerHTML=clientRows();
    decorate();announce('Página '+(clientPage+1)+' de clientes.');
  }else if(b.dataset.decision){
    const q=queue[currentItem-1];
    if(b.dataset.decision==='approve'){
      q.status='Aprobada';
      q.resolved=true;
      q.decision='Aprobación simulada registrada; ejecución no iniciada';
    }else if(b.dataset.decision==='return'){
      q.status='Devuelta al agente';
      q.resolved=false;
      q.decision='Devuelta para preparar una nueva propuesta; problema aún sin resolver';
    }else{
      q.status='Revisión humana en curso';
      q.resolved=false;
      q.decision='El PM asume la revisión; el bloqueo sigue activo';
    }
    page.innerHTML=review(q);decorate();focusHeading();announce(q.decision+'. Solo demostración.');
  }
});
root.addEventListener('change',e=>{if(e.target.id==='v-mobile-select'){render(e.target.value);announce('Vista: '+current+'.');}if(e.target.id==='v-client-filter'){clientFilter=e.target.value;clientPage=0;root.querySelector('#v-client-list').innerHTML=clientRows();decorate();announce('Cartera filtrada por '+clientFilter+'.');}});
root.addEventListener('input',e=>{if(e.target.id==='v-search'){query=e.target.value;clientPage=0;root.querySelector('#v-client-list').innerHTML=clientRows();decorate();}});
render('Centro de mando',false);

</script>
  </body>
</html>
