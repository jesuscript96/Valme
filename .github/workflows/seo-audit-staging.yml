name: SEO audit staging migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Escribe APPLY-0005-STAGING para continuar
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seo-audit-staging-migration
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    name: Apply 0005 and verify RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_APPLY_CONFIRM: apply-0005-to-${{ vars.STAGING_SUPABASE_PROJECT_REF }}
    steps:
      - name: Validate operator confirmation
        env:
          OPERATOR_CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$OPERATOR_CONFIRMATION" = "APPLY-0005-STAGING"

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run project tests
        run: bun test

      - name: Validate staging target
        run: bun run staging:seo-audit:preflight

      - name: Apply migration 0005
        run: bun run staging:seo-audit:apply

      - name: Verify tenant isolation and RLS
        run: bun run staging:seo-audit:verify
